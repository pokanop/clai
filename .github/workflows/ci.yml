name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust toolchain
        run: |
          "$CARGO_HOME/bin/cargo" --version
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
        if: runner.os == 'Linux'
      - run: |
          "$CARGO_HOME/bin/cargo" fmt --check
      - run: |
          "$CARGO_HOME/bin/cargo" test --no-default-features --locked
      - run: |
          "$CARGO_HOME/bin/cargo" clippy --no-default-features --locked -- -D warnings

  build-full:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust toolchain
        run: |
          "$CARGO_HOME/bin/cargo" --version
      - name: Install CMake
        run: command -v cmake >/dev/null || brew install cmake
      - name: Verify CMake
        run: cmake --version
      - run: |
          "$CARGO_HOME/bin/cargo" build --locked
